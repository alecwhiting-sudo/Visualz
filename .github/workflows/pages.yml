name: Deploy to GitHub Pages (dev audition)

# The GitHub Pages site is the DEV AUDITION deployment: it serves whatever was
# pushed last to main or to a claude/* feature branch, so new work can be
# demoed at the Pages URL before it merges. Production is the Vercel site,
# which deploys from main independently — nothing here touches it.
#
# NOTE: the github-pages environment must allow these branches to deploy.
# Repo Settings → Environments → github-pages → Deployment branches: either
# "No restriction" or add the pattern claude/*. With the default main-only
# policy, feature-branch runs fail at the deploy step.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages site per repo: last push wins. cancel-in-progress keeps a stale
# run from finishing after a newer one started.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VIZ_BASE: /Visualz/
      - uses: actions/configure-pages@v5
        with:
          # Attempts to enable Pages (source: GitHub Actions) automatically;
          # if the token lacks admin, enable once in Settings → Pages.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
